const LABELS={year4:'curriculum',assessment:'Assessment Studio'};
const CACHE={};
const viewer=document.getElementById('viewer'),loading=document.getElementById('loading'),loadingText=document.getElementById('loadingText'),error=document.getElementById('error'),errorText=document.getElementById('errorText');
let current='year4',sequence=0;
function base64Bytes(value){const binary=atob(value),bytes=new Uint8Array(binary.length);for(let index=0;index<binary.length;index++)bytes[index]=binary.charCodeAt(index);return bytes}
async function unpack(key){if(CACHE[key])return CACHE[key];if(typeof DecompressionStream!=='function')throw new Error('This file needs a current version of Safari, Chrome or Edge.');const bytes=base64Bytes(PACKS[key]);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!/^<!DOCTYPE html>/i.test(html.trim()))throw new Error('The embedded '+LABELS[key]+' document did not pass its integrity check.');CACHE[key]=html;return html}
async function openStudio(key,context={}){if(!PACKS[key])return;const ticket=++sequence;current=key;const status=document.getElementById('studioStatus');loading.style.display='grid';loadingText.textContent='Opening '+LABELS[key]+'…';status.textContent=loadingText.textContent;viewer.setAttribute('aria-busy','true');error.style.display='none';document.querySelectorAll('[data-studio]').forEach(button=>{const active=button.dataset.studio===key;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});try{const html=await unpack(key);if(ticket!==sequence)return;viewer.onload=()=>{if(ticket!==sequence)return;loading.style.display='none';viewer.removeAttribute('aria-busy');viewer.title=key==='year4'?'Year 4 curriculum':'Year 4 Assessment Studio';status.textContent=LABELS[key]+' ready';if(key==='year4'){const match=location.hash.match(/(?:studio-)?lesson-(\d+)/);if(match)viewer.contentWindow.postMessage({type:'JW_OPEN_LESSON',number:Number(match[1])},'*')}if(key==='assessment'&&context.lesson)viewer.contentWindow.postMessage({type:'JW_SELECT_OBJECTIVE',lesson:Number(context.lesson)},'*')};viewer.srcdoc=html}catch(failure){if(ticket!==sequence)return;loading.style.display='none';viewer.removeAttribute('aria-busy');error.style.display='grid';errorText.textContent=failure.message||String(failure);status.textContent='This section could not open'}}
document.querySelectorAll('[data-studio]').forEach(button=>button.addEventListener('click',()=>openStudio(button.dataset.studio)));
const fullButton=document.getElementById('fullButton');fullButton.addEventListener('click',async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(error){}});document.addEventListener('fullscreenchange',()=>{fullButton.textContent=document.fullscreenElement?'Exit full screen':'Full screen';fullButton.setAttribute('aria-pressed',String(!!document.fullscreenElement))});
window.addEventListener('message',event=>{if(event.source!==viewer.contentWindow)return;const data=event.data||{};if(data.type==='JW_OPEN_STUDIO'&&PACKS[data.app]){openStudio(data.app,data);return}if(data.type==='JW_ROUTE_STATE'){try{history.replaceState(null,'',location.pathname+location.search+(data.hash?'#'+data.hash:''))}catch(error){}return}if(data.type!=='JW_PRINT_DOCUMENT'||typeof data.html!=='string'||data.html.length>3000000)return;const layer=document.getElementById('printLayer'),frame=document.getElementById('printFrame');layer.classList.add('active');frame.onload=()=>{document.getElementById('printBack').focus();setTimeout(()=>{try{frame.contentWindow.focus();frame.contentWindow.print()}catch(error){window.print()}},120)};frame.srcdoc=data.html});
document.getElementById('printBack').addEventListener('click',()=>{document.getElementById('printLayer').classList.remove('active');document.getElementById('printFrame').srcdoc='';try{viewer.contentWindow.focus()}catch(error){}});
document.getElementById('printAgain').addEventListener('click',()=>{try{document.getElementById('printFrame').contentWindow.print()}catch(error){window.print()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.getElementById('printLayer').classList.contains('active'))document.getElementById('printBack').click();if((event.ctrlKey||event.metaKey)&&event.key==='1')openStudio('year4');if((event.ctrlKey||event.metaKey)&&event.key==='2')openStudio('assessment')});
openStudio('year4');
</script>
