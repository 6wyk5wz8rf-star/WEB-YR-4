<style>
:root{--ink:#142432;--text:#304555;--muted:#6b7b87;--paper:#fbfaf6;--surface:#fff;--line:#dfe5e2;--line2:#cbd6d1;--accent:#1f625e;--accent-soft:#e4f0ed;--ui:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--ui)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid rgba(31,98,94,.28);outline-offset:3px}
body{display:grid;grid-template-rows:58px minmax(0,1fr)}
.shellHeader{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(251,250,246,.97);backdrop-filter:blur(16px);z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brandMark{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;font-weight:850}.brand strong{display:block;font-size:14px;line-height:1.15}.brand span{display:block;margin-top:2px;color:var(--muted);font-size:10px;font-weight:650}
.shellNav{display:flex;align-items:center;gap:5px;padding:4px;border:1px solid var(--line);border-radius:12px;background:#fff}.shellTab,.fullButton{min-height:36px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--text);padding:7px 11px;font-size:11px;font-weight:780}.shellTab:hover,.fullButton:hover{background:#f4f7f5}.shellTab.active{border-color:#b8d0c8;background:var(--accent-soft);color:#154a47}.fullButton{border-color:var(--line2);background:#fff}
.shellMain{position:relative;min-height:0;background:#fff}.viewer{width:100%;height:100%;border:0;background:#fff;display:block}.loading,.error{position:absolute;inset:0;z-index:5}.loading{display:grid;place-items:center;background:var(--paper)}.loadingInner{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:750}.spinner{width:17px;height:17px;border:2px solid #ccd9d4;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{display:none;padding:32px;background:var(--paper)}.errorCard{max-width:650px;margin:30px auto;padding:20px;border:1px solid #d9c1bc;border-radius:15px;background:#fff;color:#71473f}.errorCard h2{margin:0 0 8px;font-size:20px}.errorCard p{margin:0;line-height:1.5;font-size:13px}
.printLayer{position:fixed;inset:0;z-index:100;display:none;grid-template-rows:54px minmax(0,1fr);background:#fff}.printLayer.active{display:grid}.printBar{display:flex;justify-content:flex-end;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--paper)}.printBar button{min-height:36px;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--ink);padding:7px 11px;font-size:11px;font-weight:780}.printBar .printAgain{background:var(--ink);border-color:var(--ink);color:#fff}.printFrame{width:100%;height:100%;border:0;background:#fff}
.tabShort{display:none}
@media(max-width:680px){.shellHeader{padding:0 8px}.brand>div{display:none}.brandMark{display:grid}.shellNav{margin-left:auto}.shellTab{white-space:nowrap;padding-inline:9px}.fullButton{display:none}}
@media(max-width:430px){.tabLong{display:none}.tabShort{display:inline}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body>*:not(.printLayer){display:none!important}.printLayer{display:block!important;position:static}.printBar{display:none!important}.printFrame{height:100vh}}
</style>

function base64Bytes(value){const binary=atob(value),bytes=new Uint8Array(binary.length);for(let index=0;index<binary.length;index++)bytes[index]=binary.charCodeAt(index);return bytes}
async function unpack(key){if(CACHE[key])return CACHE[key];if(typeof DecompressionStream!=='function')throw new Error('This file needs a current version of Safari, Chrome or Edge.');const bytes=base64Bytes(PACKS[key]);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();if(!/^<!DOCTYPE html>/i.test(html.trim()))throw new Error('The embedded '+LABELS[key]+' document did not pass its integrity check.');CACHE[key]=html;return html}
async function openStudio(key){if(!PACKS[key])return;const ticket=++sequence;current=key;loading.style.display='grid';loadingText.textContent='Opening '+LABELS[key]+'…';error.style.display='none';document.querySelectorAll('[data-studio]').forEach(button=>{const active=button.dataset.studio===key;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});try{const html=await unpack(key);if(ticket!==sequence)return;viewer.onload=()=>{if(ticket!==sequence)return;loading.style.display='none';viewer.title=key==='year4'?'Year 4 curriculum':'Year 4 Assessment Studio'};viewer.srcdoc=html}catch(failure){if(ticket!==sequence)return;loading.style.display='none';error.style.display='block';errorText.textContent=failure.message||String(failure)}}
document.querySelectorAll('[data-studio]').forEach(button=>button.addEventListener('click',()=>openStudio(button.dataset.studio)));
document.getElementById('fullButton').addEventListener('click',async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(error){}});
window.addEventListener('message',event=>{const data=event.data||{};if(data.type==='JW_OPEN_STUDIO'&&PACKS[data.app]){openStudio(data.app);return}if(data.type!=='JW_PRINT_DOCUMENT'||typeof data.html!=='string')return;const layer=document.getElementById('printLayer'),frame=document.getElementById('printFrame');layer.classList.add('active');frame.onload=()=>setTimeout(()=>{try{frame.contentWindow.focus();frame.contentWindow.print()}catch(error){window.print()}},120);frame.srcdoc=data.html});
document.getElementById('printBack').addEventListener('click',()=>{document.getElementById('printLayer').classList.remove('active');document.getElementById('printFrame').srcdoc='';try{viewer.contentWindow.focus()}catch(error){}});
document.getElementById('printAgain').addEventListener('click',()=>{try{document.getElementById('printFrame').contentWindow.print()}catch(error){window.print()}});
openStudio('year4');
</script>
</body>
</html>
